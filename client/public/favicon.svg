<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Blue rounded background matching brand color -->
  <rect width="32" height="32" rx="7" fill="#1565C0"/>

  <!-- Center pillar -->
  <rect x="15" y="7" width="2" height="16" fill="white" rx="1"/>

  <!-- Horizontal beam -->
  <rect x="7" y="8" width="18" height="1.8" fill="white" rx="0.9"/>

  <!-- Left strings (V from left beam end) -->
  <line x1="8.5" y1="9.8" x2="6"   y2="15" stroke="white" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="8.5" y1="9.8" x2="12"  y2="15" stroke="white" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Left pan (curved arc) -->
  <path d="M5.5,15 Q9,17.2 12.5,15" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Right strings (V from right beam end) -->
  <line x1="23.5" y1="9.8" x2="20" y2="15" stroke="white" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="23.5" y1="9.8" x2="26" y2="15" stroke="white" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Right pan (curved arc) -->
  <path d="M19.5,15 Q23,17.2 26.5,15" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Base bar -->
  <rect x="12" y="23" width="8" height="1.8" fill="white" rx="0.9"/>
</svg>
