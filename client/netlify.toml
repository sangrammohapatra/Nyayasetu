[build]
  base    = "client"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — all routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Proxy API calls to Render backend (avoids CORS in browser)
# Replace YOUR_RENDER_API_URL with your actual Render web service URL
[[redirects]]
  from   = "/v1/*"
  to     = "https://nyayasetu-api.onrender.com/v1/:splat"
  status = 200
  force  = true

[context.production.environment]
  NODE_ENV = "production"
